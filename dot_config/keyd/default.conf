# Managed by chezmoi (DronovasP/dotfiles: dot_config/keyd/default.conf,
# installed to /etc/keyd by a run_onchange script)
[ids]
*
# Leave virtual input devices alone: ydotool (Solaar's mouse-button -> Right
# Shift for Handy dictation) and Vicinae's snippet keyboard.
-2333:6666
-1234:5678

[main]
# Tap Caps Lock = Escape, hold Caps Lock = Super.
capslock = overload(meta, esc)

# keyd turns right-hand modifiers into left ones by default. Keep them distinct:
# Right Shift and Right Alt trigger dictation (~/.config/hypr/bindings.lua).
rightshift = rightshift
rightalt = rightalt
